# ============================================================================
# dictados.edumind.es — Ditados EDUmind (sitio estático compilado en dist/)
#
# Instalación: sudo python3 /var/www/.edumind_ops/dictados_site_install.py
# (emite el certificado, copia este vhost y las cabeceras, y recarga nginx).
#
# El editor del autor (/editor/ y /api/) NO está expuesto todavía: requiere la
# aplicación proxy en Authentik. Ver docs/DESPLIEGUE.md en el repo.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    http2 on;
    server_name dictados.edumind.es;
    include /etc/nginx/sites-available/cloudflare-origin-guard.inc;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dictados.edumind.es;
    include /etc/nginx/sites-available/cloudflare-origin-guard.inc;

    root /var/www/ditados/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/dictados.edumind.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dictados.edumind.es/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 1m;
    autoindex off;

    # Privacidad: IP anonimizada, como en el resto de sitios
    access_log /var/log/nginx/dictados.edumind.es.access.log privacy_log;
    access_log /var/log/nginx/privacy.sites.log privacy_log;
    error_log /var/log/nginx/dictados.edumind.es.error.log warn;

    include /etc/nginx/sites-available/dictados-security-headers.inc;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/manifest+json image/svg+xml text/css text/javascript text/plain text/markdown;

    location = /healthz {
        include /etc/nginx/sites-available/dictados-security-headers.inc;
        access_log off;
        add_header Content-Type text/plain;
        return 200 'dictados ok';
    }

    # El service worker nunca se cachea: así una compilación nueva llega a los navegadores.
    location = /sw.js {
        include /etc/nginx/sites-available/dictados-security-headers.inc;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        add_header Service-Worker-Allowed "/" always;
        default_type application/javascript;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/sites-available/dictados-security-headers.inc;
        add_header Cache-Control "no-cache, must-revalidate" always;
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Fuentes, audio, PDF y paquetes: pesados y estables; caché larga.
    location ~* \.(woff2|mp3|pdf|zip|svg)$ {
        include /etc/nginx/sites-available/dictados-security-headers.inc;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # Markdown de MiClase y textos del docente: se descargan, no se muestran.
    location ~* \.md$ {
        include /etc/nginx/sites-available/dictados-security-headers.inc;
        default_type text/markdown;
        add_header Content-Disposition "attachment" always;
        try_files $uri =404;
    }

    # Catálogo, fichas y presentaciones: revalidación, para que las compilaciones nuevas entren.
    location / {
        include /etc/nginx/sites-available/dictados-security-headers.inc;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ =404;
    }
}
