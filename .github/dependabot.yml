# Dependabot: este proyecto no tiene dependencias de npm; solo se vigilan las acciones de CI,
# una vez al mes y agrupadas, como en el resto de la organización.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(ci)"
    groups:
      menores-y-parches:
        update-types: ["minor", "patch"]
      mayores:
        update-types: ["major"]
